<!doctype html><html lang="ja"><meta charset="utf-8"><title>屋上設備の外観・通行確認</title>
<style>body{margin:0;overflow:hidden}nav{position:absolute;top:8px;left:8px;background:#fffffff0;padding:10px;font:13px sans-serif;max-width:420px}button{margin:4px}output{display:block;white-space:pre-line}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<nav><button id="west">西側のアイボリービル</button><button id="east">東側の白いビル</button><button id="walk">入口前を歩く（実際の歩行処理）</button><button id="roof">外観全体（確認用視点）</button><output>読み込み中</output></nav>
<script type="module">
import * as THREE from 'three';
import {createWorld} from '../src/map/world.js';
import {createCity,CITY_BUILDINGS} from '../src/map/city.js';
import {createCamera} from '../src/camera.js';
import {createPlayer} from '../src/player/player.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe6e8e6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf4f8ff,0xb5ada0,2.2));
const sun=new THREE.DirectionalLight(0xfff5e7,3);sun.position.set(-15,30,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:.1,far:100});sun.shadow.normalBias=.015;scene.add(sun);
createWorld(scene);const city=await createCity(scene),rig=createCamera(),player=await createPlayer(scene,rig.camera);
const ids=['general-west-north','general-east-west','general-west-south','general-east-rear','outer-east-north'],results=[];
const check=(name,ok)=>{if(!ok)throw Error(name);results.push('PASS '+name);};
check('変更対象は普通の建物5棟のみ',city.root.children.filter(g=>g.getObjectByName('featured-building-details')).length===5);
check('ヨドバシ風建物は対象外',!city.root.getObjectByName('yodobashi').getObjectByName('featured-building-details'));
for(const id of ids){
 const b=CITY_BUILDINGS.find(b=>b.id===id),g=city.root.getObjectByName(id),details=g.getObjectByName('featured-building-details');
 check(id+'：元の外壁・入口・屋上の緑を維持',g.getObjectByName(id+':body').visible&&!!g.getObjectByName('clean-building-details')&&!!g.getObjectByName('wide-entrance')&&(g.userData.roofPattern==='F'||!!g.getObjectByName('roof-green')));
 const bound=new THREE.Box3();let triangles=0;
 for(const mesh of details.children){mesh.geometry.computeBoundingBox();bound.union(mesh.geometry.boundingBox);triangles+=mesh.geometry.index.count/3;}
 check(id+'：通路への張り出し2cm以内',bound.min.x>=-b.width/2-.02&&bound.max.x<=b.width/2+.02&&bound.min.z>=-b.depth/2-.02&&bound.max.z<=b.depth/2+.02);
 check(id+'：既存の位置・当たり判定用ボディ維持',g.position.x===b.x&&g.position.z===b.z&&city.boxes.includes(g.getObjectByName(id+':body')));
 check(id+'：12描画バッチ・2500三角形以内',details.children.length<=12&&triangles<=2500);
 results.push(`${id}: ${details.children.length} batches / ${triangles} triangles`);
}
for(const id of ids.slice(2)){const button=document.createElement('button');button.textContent=id;button.onclick=()=>select(id);document.querySelector('nav').prepend(button);}
let chosen,walking=false,last,startX,roofView=false;
const output=document.querySelector('output');
function stop(){window.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowUp',code:'ArrowUp'}));walking=false;}
function select(id){stop();roofView=false;chosen=CITY_BUILDINGS.find(b=>b.id===id);player.setPosition(new THREE.Vector3(chosen.x-chosen.width/2-.5,0,chosen.z+chosen.depth/2+.65));output.textContent=results.join('\n');}
document.querySelector('#west').onclick=()=>select(ids[0]);document.querySelector('#east').onclick=()=>select(ids[1]);
document.querySelector('#walk').onclick=()=>{select(chosen.id);startX=player.position.x;walking=true;window.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp',code:'ArrowUp'}));};
document.querySelector('#roof').onclick=()=>{stop();roofView=true;};
function resize(){renderer.setSize(innerWidth,innerHeight);rig.resize(innerWidth,innerHeight);}resize();addEventListener('resize',resize);select(ids[1]);
renderer.setAnimationLoop(now=>{const dt=last?Math.min((now-last)/1000,.05):0;last=now;player.update(dt);
 if(walking&&player.position.x-startX>=chosen.width+1){stop();output.textContent=results.join('\n')+'\nPASS 入口前を実際の歩行処理で通過';}
 city.finish.userData.coast.update(dt,player);rig.follow(player.position,dt);
 if(roofView){const target=new THREE.Vector3(chosen.x,chosen.height/2,chosen.z);rig.camera.position.copy(target).add(new THREE.Vector3(-30,30,30));rig.camera.lookAt(target);}
 renderer.render(scene,rig.camera);
});
</script></html>
