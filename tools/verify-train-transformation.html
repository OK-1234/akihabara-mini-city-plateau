<!doctype html><meta charset="utf-8"><title>電車・高架歩行・階段確認</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><pre id="result">確認中</pre><script type="module">
import * as T from 'three';import {createWorld,ELEVATION} from '../src/map/world.js';import {createCity,CITY_BUILDINGS} from '../src/map/city.js';import {createPlayer} from '../src/player/player.js';import {createCamera} from '../src/camera.js';import {createOpening} from '../src/player/opening.js';import {createCarTransformation} from '../src/player/car-transformation.js';import {createTrainTransformation} from '../src/player/train-transformation.js';
const checks=[],captures=[];let stairCameraJumps=[];const check=(ok,msg)=>{if(!ok)throw Error(msg);checks.push('PASS '+msg);};
try{
const scene=new T.Scene();createWorld(scene);const city=await createCity(scene),rig=createCamera(),p=await createPlayer(scene,rig.camera),access=city.access.mount(p),auto=city.viaduct.trains.vertical;
let train;const car=createCarTransformation(scene,p,rig.camera,city.volumes.deck.source.sedan.placement,()=>!train?.active&&!access.elevated),opening=createOpening(p,rig,city.root.getObjectByName('station'),city.viaduct.trains.horizontal);
train=createTrainTransformation(scene,p,auto,()=>!opening.active&&car.mode==='walk',access);
const key=(type,code,repeat=false)=>window.dispatchEvent(new KeyboardEvent(type,{key:code==='KeyE'?'e':code,code,repeat}));const press=code=>{key('keydown',code);key('keyup',code);};
const tick=seconds=>{for(let left=seconds;left>1e-8;left-=.02){const dt=Math.min(.02,left),oldY=rig.camera.position.y,oldGround=p.groundHeight;p.update(dt);if(!train.active){access.update();auto.update(dt);}opening.update(dt);train.update(dt);if(!opening.active){car.update(dt);rig.follow(p.position,dt,train.active||car.mode!=='walk');rig.camera.position.y+=access.updateCamera(dt);if(p.position.x< -1.5&&Math.abs(p.groundHeight-oldGround)>.01)stairCameraJumps.push(Math.abs(rig.camera.position.y-oldY));}}};
function walkTo(x,z){for(let i=0;i<2000;i++){const dx=x-p.position.x,dz=z-p.position.z;if(Math.hypot(dx,dz)<.04)return;const code=Math.abs(dx)>.035?(dx>0?'ArrowUp':'ArrowDown'):(dz>0?'ArrowRight':'ArrowLeft');key('keydown',code);tick(Math.min(.01,Math.max(Math.abs(dx),Math.abs(dz))/3));key('keyup',code);}throw Error('walk blocked at '+p.position.toArray()+' target '+x+','+z);}

function capture(label){scene.updateMatrixWorld(true);const r=new T.WebGLRenderer({antialias:true});r.setSize(600,400);r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;rig.resize(600,400);r.render(scene,rig.camera);const c=document.createElement('canvas');c.width=600;c.height=400;c.getContext('2d').drawImage(r.domElement,0,0);captures.push({label,c});r.dispose();}
scene.background=new T.Color(0xe6e8e6);scene.add(new T.HemisphereLight(0xf4f8ff,0xb5ada0,2.2));const light=new T.DirectionalLight(0xfff5e7,3);light.position.set(-15,30,20);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:.1,far:100});light.shadow.normalBias=.015;scene.add(light);
function enter(){press('KeyE');check(train.phase==='enter'&&!train.train.root.visible&&p.model.parent.visible,'entry begins without instant swap');check(train.smoke.every(e=>e.root.visible&&e.root.position.y===ELEVATION),'smoke at railway height');tick(.2);check(!train.train.root.visible,'train held until smoke thickens');press('ArrowUp');check(train.stage===0,'input blocked during smoke');tick(.2);check(train.train.root.visible&&!p.model.parent.visible,'enter swaps inside smoke');capture('電車へ変身・煙の中');tick(.5);check(!train.phase&&train.smoke.every(e=>!e.root.visible),'entry smoke completes');}
function leave(){press('KeyE');check(train.phase==='exit'&&train.train.root.visible&&!p.model.parent.visible,'exit begins without instant swap');tick(.2);check(train.train.root.visible,'train remains before smoke cover');tick(.2);check(!train.train.root.visible&&p.model.parent.visible&&train.smoke.every(e=>e.root.visible),'exit swaps inside smoke');capture('タヌキへ復帰・煙の中');tick(.5);check(!train.active&&!train.phase&&auto.root.visible,'exit completes and autonomous resumes');}
train.update();press('KeyE');check(!train.active&&!train.discover.visible,'opening blocks transformation');tick(16);check(!opening.active,'opening finishes');walkTo(train.point.x,train.point.z);train.update();check(train.discover.visible,'walk back to station prompt');enter();check(train.active&&!auto.root.visible&&train.train.root.visible,'manual copy replaces autonomous train');
const autoZ=auto.root.position.z,start=train.train.root.position.z;press('ArrowUp');tick(.3);check(train.speed===-.65&&train.train.root.position.z<start,'up = sea / low');press('ArrowUp');tick(.3);check(train.speed===-1.6,'sea standard speed');press('ArrowUp');tick(.3);check(train.speed===-2.4,'sea high speed');check(!train.revert.visible,'moving hides revert');press('KeyE');check(train.active,'moving exit blocked');
press('ArrowDown');tick(.3);check(train.speed===-1.6,'down decelerates sea travel');press('ArrowDown');tick(.3);press('ArrowDown');tick(.1);check(train.speed<0&&!train.revert.visible,'braking hides revert');tick(.2);check(train.speed===0&&train.revert.visible,'full stop allows revert');
const turn=train.train.root.position.z;press('ArrowDown');tick(.3);check(train.speed===.65&&train.train.root.position.z>turn,'down = station');press('ArrowUp');tick(.3);press('ArrowUp');press('ArrowUp');tick(2);press('ArrowDown');press('ArrowDown');tick(.3);
check(auto.root.position.z===autoZ,'autonomous train frozen during transformation');const stopped=train.train.root.position.z;
scene.updateMatrixWorld(true);const bounds=o=>new T.Box3().setFromObject(o,true),sea=bounds(train.seaCar),other=bounds(train.train.cars.find(c=>c!==train.seaCar)),leaf=bounds(train.leaf);check(sea.getCenter(new T.Vector3()).z<other.getCenter(new T.Vector3()).z&&train.leaf.visible,'one leaf on fixed sea carriage');check(leaf.min.z>=sea.min.z&&leaf.max.z<=sea.max.z,'leaf near sea cab');
leave();check(!train.active&&!train.train.root.visible&&auto.root.visible,'manual train hidden / original restored');check(Math.abs(p.position.z-stopped)<1e-7&&p.groundHeight===ELEVATION&&access.elevated,'disembark at stopped Z on deck');check(p.tanuki.rotation.y===Math.PI,'restore heading from last sea travel');check(car.mode==='walk','car remains inactive during train control');const autoBefore=auto.root.position.z;tick(.3);check(auto.root.position.z!==autoBefore,'autonomous train moves while avatar on deck');check(Math.abs(rig.camera.position.y-(30.5+ELEVATION))<1e-6,'camera follows elevated feet');capture('高架上のタヌキと影');const bodyCenter=new T.Box3().setFromObject(p.tanuki,true).getCenter(new T.Vector3()),towardLight=light.position.clone().normalize(),roadPoint=bodyCenter.clone().addScaledVector(towardLight,-bodyCenter.y/towardLight.y);const shadowRay=new T.Raycaster(roadPoint,towardLight);check(shadowRay.intersectObject(scene.getObjectByName('vertical-deck-3'))[0]?.distance<bodyCenter.distanceTo(roadPoint),'deck intercepts avatar shadow ray above ground');walkTo(0,stopped);check(p.groundHeight>=ELEVATION,'track surface supports walking');walkTo(-.99,stopped);key('keydown','ArrowDown');tick(.5);key('keyup','ArrowDown');check(p.position.x>=city.access.deck.min.x+.48,'side wall prevents falling');
walkTo(-.99,8.05);walkTo(-7,8.05);check(p.position.x< -6&&access.elevated,'walk across junction to west horizontal deck');walkTo(7,8.05);check(p.position.x>6&&access.elevated,'walk east horizontal deck');walkTo(-.99,8.05);walkTo(-.99,(city.access.openingMin+city.access.openingMax)/2);check(p.groundHeight===ELEVATION,'walk deck to sea-side opening');capture('階段入口：通常カメラ');walkTo(city.access.x,p.position.z);check(p.groundHeight===ELEVATION,'walk through west opening onto landing');walkTo(city.access.bottomX+.9,city.access.z);check(p.groundHeight>0&&p.groundHeight<ELEVATION,'walk down real steps');capture('画像の左手前へ降りる階段：通常カメラ');walkTo(city.access.bottomX-.4,city.access.z);check(!access.elevated&&p.groundHeight===0,'reach ground without station teleport');
walkTo(city.access.x,city.access.z);walkTo(-.99,p.position.z);check(access.elevated&&p.groundHeight===ELEVATION,'walk back up stairs to deck');
const stair=bounds(city.access.root);for(const b of CITY_BUILDINGS){check(!stair.intersectsBox(bounds(city.root.getObjectByName(b.id))),'stairs clear '+b.id);}check(!city.root.getObjectByName('north-infill--1'),'only obstructing building removed');check(!scene.getObjectByName('west-wall-before-opening')&&!scene.getObjectByName('landing-south-wall'),'unneeded entrance walls removed');check(city.access.bottomX<city.access.topX,'stairs descend west as reference');check(!city.root.getObjectByName('outer-north-west'),'directly intersecting west building removed');check(scene.getObjectByName('landing-sea-wall')?.material===scene.getObjectByName('east-wall').material,'sea landing wall uses existing material');check(!scene.getObjectByName('landing-west-wall'),'westward stair entrance not blocked');check(scene.getObjectByName('vertical-deck-3').castShadow&&scene.getObjectByName('horizontal-deck-3').castShadow,'decks block light to roads');check(stairCameraJumps.length>5&&Math.max(...stairCameraJumps)<.1,'step contact preserved / camera jumps smoothed (max '+Math.max(...stairCameraJumps).toFixed(3)+' per 20ms)');const end=scene.getObjectByName('sea-end-wall'),side=scene.getObjectByName('east-wall');check(end.material===side.material&&end.geometry.parameters.height===.35&&end.geometry.parameters.depth===.04,'sea end wall matches existing walls');
// Walk back down, return via ground, and repeat transformation.
walkTo(city.access.x,p.position.z);walkTo(city.access.bottomX-.4,city.access.z);walkTo(city.access.bottomX-.4,-15.5);walkTo(-1,-15.5);walkTo(0,train.point.z);train.update();check(train.discover.visible,'ground return rearms station');enter();press('ArrowUp');press('ArrowUp');press('ArrowUp');tick(30);check(train.train.root.position.z===train.train.min&&train.speed===0&&train.revert.visible,'sea endpoint stops inside track');press('ArrowDown');tick(.3);check(train.speed===.65,'station low');press('ArrowDown');tick(.3);check(train.speed===1.6,'station standard');press('ArrowDown');tick(.3);check(train.speed===2.4,'station high');tick(30);check(train.train.root.position.z===train.train.max&&train.speed===0,'station endpoint stops inside track');leave();check(!train.active&&access.elevated,'second transformation/disembark succeeds');check(p.tanuki.rotation.y===0,'restore heading from last station travel');
const r=new T.WebGLRenderer({antialias:true});r.setSize(900,600);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;const c=new T.PerspectiveCamera(45,1.5,.1,100);c.position.set(-10,12,-28);c.lookAt(-2,1,-18);r.render(scene,c);document.body.append(r.domElement);
for(const {label,c} of captures){const block=document.createElement('div');block.append(label,c);document.body.append(block);}document.querySelector('#result').textContent=checks.join('\n');
}catch(e){document.querySelector('#result').textContent=checks.join('\n')+'\nFAIL '+e.stack;}
</script>
